<script>
(()=>{const p=new URLSearchParams(location.search),concept=p.has('concept')?p.get('concept'):(location.hostname.includes('croq')?'QRoque':'QRamen'),q=concept==='QRoque',name=q?'QRoque Monsieur':'Le QRamen';document.body.classList.toggle('theme-qroque',q);document.title=name+' — commande à table';document.querySelector('meta[name="theme-color"]').content=q?'#F3EDE1':'#14161A';document.querySelector('#brand-logo').src='assets/marque-'+(q?'croque':'qramen')+'.svg';document.querySelector('#landing-mascot').src='assets/mascottes/'+(q?'croque-2-monsieur':'ramen-1-bol')+'.png';document.querySelector('#site-favicon').href='assets/favicon-'+(q?'croque':'qramen')+'.svg';document.querySelector('#eyebrow').textContent=q?'CROQUE-MONSIEUR · ROUEN':'BAR À RAMEN · ROUEN';document.querySelector('#landing-title').innerHTML=q?'QRoque<br><em>Monsieur</em>':'Le<br><em>QRamen</em>';document.querySelector('#landing-kicker').innerHTML=q?'LE BONHEUR ENTRE DEUX TRANCHES <span>·</span> ROUEN':'一杯のよろこび <span>·</span> ROUEN';document.querySelector('#landing-baseline').innerHTML=q?'Du croustillant, du fondant.<br><strong>Du fait maison.</strong>':'Scannez. Commandez.<br><strong>Slurpez.</strong>';if(q){document.querySelector('#landing-bottom').innerHTML='<div><span class="label">LE COMPTOIR</span><p>QRoque Monsieur<br>Rouen</p></div><div><span class="label">À TABLE</span><p>Tous les jours<br>12h–14h30 · 19h–22h30</p></div><span class="landing-jp" aria-hidden="true">CROQUE</span>';document.querySelector('.landing-card').classList.add('landing-qroque')}const ml=document.querySelector('#menu-link');ml.href='menu.html'+location.search;document.querySelectorAll('.restaurant-switch a').forEach(a=>{const active=a.dataset.concept===concept;if(active)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');const target=new URL(a.href);for(const [k,v] of p)if(k==='table')target.searchParams.set(k,v);a.href=target.href})})();
</script></body></html>
