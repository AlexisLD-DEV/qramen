<body data-theme-scope="staff" class="qr-page"><script>try{if(localStorage.getItem('qramen-theme-staff')==='dark')document.body.classList.add('dark-mode')}catch(e){}</script><header class="site-header"><a class="header-brand" href="index.html"><img id="header-logo" alt=""><span id="brand-name">Le QRamen</span></a><a href="index.html" class="qr-back">Retour à l’accueil</a><button class="theme-toggle" type="button" aria-label="Activer le mode sombre">☾</button></header>

<section class="qr-tools qr-add-table" aria-label="Ajouter une table"><div class="qr-field"><label for="new-table-id">Identifiant (facultatif)</label><input id="new-table-id" maxlength="24" placeholder="Automatique : T08"></div><div class="qr-field"><label for="new-table-name">Nom</label><input id="new-table-name" maxlength="80" placeholder="Terrasse 1" required></div><div class="qr-actions"><button class="qr-action primary" id="add-table" type="button">Ajouter une table</button></div><p id="add-table-status" class="qr-status" role="status" aria-live="polite"></p></section><div class="qr-list-heading"><h2>Tables enregistrées</h2><span class="label">A4 OU COMPTOIR</span></div><div class="qr-loading" id="qr-loading" role="status"><div class="mascot-loading" aria-hidden="true"></div><p class="qr-status" id="qr-status">Synchronisation des tables…</p></div><section class="qr-list" id="table-list" aria-label="Liste des QR de table"></section></main><footer class="site-footer qr-signature"><div class="footer-brand-row"><span class="footer-brand-name">Le QRamen</span><img class="footer-mascot" src="assets/mascottes/ramen-1-bol.png?v=20261017-detourage" alt="" aria-hidden="true"><span class="signature-links"><a href="https://alexisld.fr">alexisld.fr</a><span aria-hidden="true">·</span><a href="https://github.com/AlexisLD-DEV/qramen">GitHub</a></span></div></footer>
<section class="qr-print-sheet" id="print-sheet" aria-label="Chevalet imprimable"></section>
<script src="assets/vendor/qrcode.js"></script><script src="assets/api.js"></script><script>
(()=>{const params=new URLSearchParams(location.search);let current=params.get('concept')||(location.hostname.includes('qroque')?'QRoque':'QRamen');const $=s=>document.querySelector(s),restaurant=$('#restaurant'),name=$('#table-name'),img=$('#preview-qr'),urlOut=$('#preview-url'),list=$('#table-list'),status=$('#qr-status');const known=Array.from({length:7},(_,i)=>'T'+String(i+1).padStart(2,'0'));let tables=known,tableNames={};
function brand(){const croq=restaurant.value==='QRoque';const mascotSrc=croq?'assets/mascottes/compact-qroque.svg':'assets/mascottes/identite-qramen.png?v=20261017-detourage';$('#header-logo').src=mascotSrc;$('.footer-mascot').src=mascotSrc;const loader=document.querySelector('.qr-loading .mascot-loading'),loaderMascot=document.createElement('img');loaderMascot.src=mascotSrc;loaderMascot.alt='';loader.replaceChildren(loaderMascot);$('#site-favicon').href=croq?'assets/mascottes/identite-qroque.png?v=20261017-detourage':'assets/mascottes/identite-qramen.png?v=20261017-detourage';$('#brand-name').innerHTML=croq?'<b>QRoque</b> Monsieur':'Le <b>QR</b>amen';$('.footer-brand-name').innerHTML=croq?'<span>QRoque</span> <em>Monsieur</em>':'<span>Le</span> <em>QRamen</em>';$('#qr-kicker').textContent=croq?'QROQUE MONSIEUR · ROUEN':'LE QRAMEN · ROUEN';document.body.classList.toggle('theme-qroque',croq);document.title='QR des tables — '+(croq?'QRoque Monsieur':'Le QRamen')}
function escapeHtml(v){const e=document.createElement('span');e.textContent=v;return e.innerHTML}function cleanTable(v){return v.trim().replace(/[?#&]/g,'').slice(0,24)||'T01'}function menuUrl(t){const host=restaurant.value==='QRoque'?'https://qroque.alexisld.fr':'https://qramen.alexisld.fr';return host+'/menu.html?table='+encodeURIComponent(cleanTable(t))}
function code(text){const qr=qrcode(0,'M');qr.addData(text);qr.make();return qr.createSvgTag({cellSize:8,margin:24,scalable:true})}function update(){brand();const t=cleanTable(name.value);const u=menuUrl(t);const svg=code(u);img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);img.alt='QR code pour la table '+t;urlOut.textContent=u;const fmt=document.querySelector('[name=print-format]:checked').value,preview=$('#print-preview');preview.className='print-preview '+fmt;preview.innerHTML='<div class="mini-sheet">'+(fmt==='a4'?'<i></i>':'<i></i>')+'</div><p><strong>'+(fmt==='a4'?'A4 · 1 QR par page':'Comptoir · chevalet A5')+'</strong><br>QR '+(fmt==='a4'?'80 mm':'62 mm')+' · fond ivoire</p>';const warning=$('#qr-table-warning');warning.hidden=tables.includes(t);warning.textContent=warning.hidden?'':'Table non enregistrée : ce QR ouvre une démo sans envoi au restaurant.'}
function printAll(print=true){const croq=restaurant.value==='QRoque',root=$('#print-sheet'),brandName=croq?'QRoque Monsieur':'Le QRamen',format=document.querySelector('[name=print-format]:checked').value,comptoir=format==='comptoir',mascot='assets/mascottes/'+(croq?'croque-2-monsieur':'ramen-1-bol')+'.png?v=20261017-detourage';root.className='qr-print-sheet '+format;root.innerHTML='';for(let i=0;i<tables.length;i++){const t=tables[i],page=document.createElement('section');page.className='print-page';page.innerHTML='<div class="print-page-title">'+(comptoir?'COMPTOIR · FORMAT A5':'A4 · UNE TABLE PAR PAGE')+'</div>';const card=document.createElement('article');card.className='print-card';card.innerHTML='<img class="print-mascot" src="'+mascot+'" alt=""><h2>Commandez<br>à votre table</h2><p>Scannez pour commander</p><img class="print-qr" alt="QR code de table '+escapeHtml(t)+'"><strong>TABLE '+escapeHtml(t)+'</strong><footer>'+brandName+' · ROUEN<br>14 rue du Gros-Horloge</footer>';card.querySelector('.print-qr').src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(code(menuUrl(t)));page.append(card);root.append(page)}if(print)Promise.all([...root.querySelectorAll('img')].map(i=>i.decode().catch(()=>{}))).then(()=>window.print())}
function render(){list.innerHTML='';tables.forEach(t=>{const u=menuUrl(t),card=document.createElement('article');card.className='qr-table-card';card.innerHTML='<img alt="QR '+escapeHtml(t)+'"><div><h3></h3><p></p></div>';const qr=card.querySelector('img');qr.width=88;qr.height=88;qr.loading='lazy';qr.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(code(u));card.querySelector('h3').textContent=tableNames[t]?t+' · '+tableNames[t]:t;card.querySelector('p').textContent=u;list.append(card)})}
name.addEventListener('input',update);document.querySelectorAll('[name=print-format]').forEach(r=>r.addEventListener('change',update));restaurant.addEventListener('change',()=>{update();render()});$('#print-custom').onclick=()=>printAll();
$('#add-table').addEventListener('click',async()=>{const out=$('#add-table-status'),identifiant=$('#new-table-id').value.trim(),nom=$('#new-table-name').value.trim();if(!nom){out.textContent='Saisissez un nom de table.';return}out.textContent='Création…';try{const response=await fetch(window.QRAMEN_API+'/tables',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({...(identifiant?{identifiant}:{}),nom}),signal:AbortSignal.timeout(8000)});const data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.error||`Erreur ${response.status}`);const id=data.table?.identifiant;if(!id)throw Error('Réponse de création invalide');if(!tables.includes(id))tables.push(id);tables.sort((a,b)=>a.localeCompare(b,'fr',{numeric:true}));tableNames[id]=data.table.nom||nom;name.value=id;$('#new-table-id').value='';$('#new-table-name').value='';out.textContent=`${id} ajoutée : son QR est disponible dans la liste.`;status.textContent=`${tables.length} tables actives`;render();update()}catch(error){out.textContent=error.message||'Création impossible. Réessayez.'}});(async()=>{const croq=current==='QRoque';restaurant.value=croq?'QRoque':'QRamen';update();render();try{const r=await qramenFetch('/tables',{timeoutMs:4500});const d=await r.json();const rows=Array.isArray(d.tables)?d.tables:[];const active=rows.filter(x=>x&&x.active!==false&&x.identifiant);if(!active.length)throw Error('Aucune table');tables=active.map(x=>cleanTable(x.identifiant));tableNames=Object.fromEntries(active.map(x=>[cleanTable(x.identifiant),x.nom||'']));status.textContent=`${tables.length} tables actives · Airtable`;}catch{status.textContent='Tables T01 à T07 · valeurs par défaut';}$('#qr-loading').classList.add('finished');render()})();
let restoreDarkAfterPrint=false;window.addEventListener('beforeprint',()=>{restoreDarkAfterPrint=document.body.classList.contains('dark-mode');document.body.classList.remove('dark-mode');if(!$('#print-sheet').innerHTML)printAll(false)});window.addEventListener('afterprint',()=>{if(restoreDarkAfterPrint)document.body.classList.add('dark-mode')});
})();</script><script src="assets/theme.js?v=20261015-scope-staff2"></script></body></html>
