<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#F7F2E9"><title>QR des tables</title><link id="site-favicon" rel="icon" href="assets/favicon-qramen.svg" type="image/svg+xml"><link rel="preload" href="assets/fonts/baloo-2.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="assets/fonts/nunito.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="assets/style.css"></head>
<body class="qr-page"><header class="site-header"><a class="header-brand" href="index.html"><img id="header-logo" src="assets/mascottes/compact-qramen.svg" alt=""><span id="brand-name">Le QRamen</span></a><nav class="restaurant-switch compact" aria-label="Choisir un restaurant"><a data-concept="QRamen" href="https://qramen.alexisld.fr/qr.html">QRamen</a><a data-concept="QRoque" href="https://qroque.alexisld.fr/qr.html">QRoque</a></nav><a href="index.html" class="qr-back">Retour à l’accueil</a></header>
<main class="qr-main"><section class="qr-intro"><p class="kicker" id="qr-kicker">LE QRAMEN · ROUEN</p><h1>QR des tables</h1><p>Préparez un QR prêt à imprimer pour chaque table. <a href="salle.html" class="qr-back">Ouvrir la vue salle</a></p></section>
<section class="qr-tools" aria-label="Générateur de QR"><div class="qr-field"><label for="restaurant">Restaurant</label><select id="restaurant"><option value="QRamen">Le QRamen</option><option value="QRoque">QRoque Monsieur</option></select></div><div class="qr-field"><label for="table-name">Nom ou numéro de table</label><input id="table-name" value="T01" maxlength="24" autocomplete="off"></div><fieldset class="qr-field qr-format"><legend>Format du PDF</legend><label><input type="radio" name="print-format" value="a4" checked> A4 <span>4 chevalets par feuille, traits de coupe</span></label><label><input type="radio" name="print-format" value="comptoir"> Comptoir <span>chevalet A5 centré sur A4</span></label></fieldset><div class="qr-actions"><button class="qr-action primary" id="print-custom">Imprimer / Télécharger le PDF</button></div><div id="print-preview" class="print-preview a4" aria-label="Aperçu du format choisi"></div><div class="qr-preview"><img id="preview-qr" width="160" height="160" alt="QR code de la table T01"><p id="preview-url"></p><p id="qr-table-warning" class="demo-note" role="status" hidden></p></div></section>
<div class="qr-list-heading"><h2>Tables enregistrées</h2><span class="label">A4 OU COMPTOIR</span></div><div class="qr-loading" id="qr-loading" role="status"><div class="mascot-loading" aria-hidden="true"><img src="assets/mascottes/compact-qramen.svg" alt=""><img src="assets/mascottes/compact-qroque.svg" alt=""></div><p class="qr-status" id="qr-status">Tables T01 à T07 · synchronisation…</p></div><section class="qr-list" id="table-list" aria-label="Liste des QR de table"></section></main><footer class="site-footer qr-signature"><span class="signature-links"><a href="https://alexisld.fr">alexisld.fr</a><span aria-hidden="true">·</span><a href="https://github.com/AlexisLD-DEV/qramen">GitHub</a></span></footer>
<section class="qr-print-sheet" id="print-sheet" aria-label="Chevalet imprimable"></section>
<script src="assets/vendor/qrcode.js"></script><script src="assets/api.js"></script><script>
(()=>{const params=new URLSearchParams(location.search);let current=params.get('concept')||(location.hostname.includes('qroque')?'QRoque':'QRamen');const $=s=>document.querySelector(s),restaurant=$('#restaurant'),name=$('#table-name'),img=$('#preview-qr'),urlOut=$('#preview-url'),list=$('#table-list'),status=$('#qr-status');const known=Array.from({length:7},(_,i)=>'T'+String(i+1).padStart(2,'0'));let tables=known;
function brand(){const croq=restaurant.value==='QRoque';$('#header-logo').src='assets/mascottes/compact-'+(croq?'qroque':'qramen')+'.svg';document.querySelectorAll('.mascot-loading img').forEach(img=>img.remove());const loaderMascot=document.createElement('img');loaderMascot.src='assets/mascottes/compact-'+(croq?'qroque':'qramen')+'.svg';loaderMascot.alt='';document.querySelector('.qr-loading .mascot-loading').append(loaderMascot);$('#site-favicon').href='assets/favicon-'+(croq?'croque':'qramen')+'.svg';$('#brand-name').textContent=croq?'QRoque Monsieur':'Le QRamen';$('#qr-kicker').textContent=croq?'QROQUE MONSIEUR · ROUEN':'LE QRAMEN · ROUEN';document.body.classList.toggle('theme-qroque',croq);document.title='QR des tables — '+(croq?'QRoque Monsieur':'Le QRamen')}
function escapeHtml(v){const e=document.createElement('span');e.textContent=v;return e.innerHTML}function cleanTable(v){return v.trim().replace(/[?#&]/g,'').slice(0,24)||'T01'}function menuUrl(t){const host=restaurant.value==='QRoque'?'https://qroque.alexisld.fr':'https://qramen.alexisld.fr';return host+'/menu.html?table='+encodeURIComponent(cleanTable(t))}
function code(text){const qr=qrcode(0,'M');qr.addData(text);qr.make();return qr.createSvgTag({cellSize:8,margin:24,scalable:true})}function update(){brand();const t=cleanTable(name.value);const u=menuUrl(t);const svg=code(u);img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);img.alt='QR code pour la table '+t;urlOut.textContent=u;const fmt=document.querySelector('[name=print-format]:checked').value,preview=$('#print-preview');preview.className='print-preview '+fmt;preview.innerHTML='<div class="mini-sheet">'+(fmt==='a4'?'<i></i><i></i><i></i><i></i>':'<i></i>')+'</div><p><strong>'+(fmt==='a4'?'A4 · 4 chevalets par feuille':'Comptoir · chevalet A5')+'</strong><br>QR '+(fmt==='a4'?'45 mm':'62 mm')+' · repères de coupe</p>';const warning=$('#qr-table-warning');warning.hidden=/^T0[1-7]$/.test(t.toUpperCase());warning.textContent=warning.hidden?'':'Table non enregistrée : ce QR ouvre une démo sans envoi au restaurant.'}
function printAll(print=true){const croq=restaurant.value==='QRoque',root=$('#print-sheet'),brandName=croq?'QRoque Monsieur':'Le QRamen',format=document.querySelector('[name=print-format]:checked').value,comptoir=format==='comptoir',mascot='assets/mascottes/'+(croq?'croque-2-monsieur':'ramen-1-bol')+'.png';root.className='qr-print-sheet '+format;root.innerHTML='';const batch=comptoir?1:4;for(let i=0;i<tables.length;i+=batch){const page=document.createElement('section');page.className='print-page';page.innerHTML='<div class="print-page-title">'+(comptoir?'COMPTOIR · FORMAT A5':'A4 · 4 CHEVALETS PAR FEUILLE · DÉCOUPER SUR LES POINTILLÉS')+'</div>';tables.slice(i,i+batch).forEach(t=>{const card=document.createElement('article');card.className='print-card';card.innerHTML='<img class="print-mascot" src="'+mascot+'" alt=""><h2>Commandez<br>à votre table</h2><p>Scannez pour commander</p><img class="print-qr" alt="QR code de table '+escapeHtml(t)+'"><strong>TABLE '+escapeHtml(t)+'</strong><footer>'+brandName+' · ROUEN<br>14 rue du Gros-Horloge</footer>';card.querySelector('.print-qr').src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(code(menuUrl(t)));page.append(card)});root.append(page)}if(print)Promise.all([...root.querySelectorAll('img')].map(i=>i.decode().catch(()=>{}))).then(()=>window.print())}
function render(){list.innerHTML='';tables.forEach(t=>{const u=menuUrl(t),card=document.createElement('article');card.className='qr-table-card';card.innerHTML='<img alt="QR '+escapeHtml(t)+'"><div><h3></h3><p></p></div>';const qr=card.querySelector('img');qr.width=88;qr.height=88;qr.loading='lazy';qr.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(code(u));card.querySelector('h3').textContent=t;card.querySelector('p').textContent=u;list.append(card)})}
name.addEventListener('input',update);document.querySelectorAll('[name=print-format]').forEach(r=>r.addEventListener('change',update));restaurant.addEventListener('change',()=>{update();render()});$('#print-custom').onclick=()=>printAll();
(async()=>{const croq=current==='QRoque';restaurant.value=croq?'QRoque':'QRamen';document.querySelectorAll('.restaurant-switch a').forEach(a=>{if((a.dataset.concept==='QRoque')===croq)a.setAttribute('aria-current','page')});update();render();try{const r=await qramenFetch('/menu?concept='+encodeURIComponent(restaurant.value),{timeoutMs:4500});if(!r.ok)throw 0;const d=await r.json();const rows=d.tables||d.tablesDuRestaurant||d.restaurant?.tables||[];const names=rows.map(x=>typeof x==='string'?x:(x.numero||x.nom||x.code||x.table)).filter(Boolean);if(names.length)tables=names.map(cleanTable);status.textContent=names.length?tables.length+' tables reçues du menu':'Tables T01 à T07 · valeurs par défaut';}catch{status.textContent='Tables T01 à T07 · mode hors connexion';}$('#qr-loading').classList.add('finished');render()})();
window.addEventListener('beforeprint',()=>{if(!$('#print-sheet').innerHTML)printAll(false)});
})();</script></body></html>
