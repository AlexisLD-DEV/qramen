<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#F7F2E9"><title>QR des tables</title><link id="site-favicon" rel="icon" href="assets/favicon-qramen.svg" type="image/svg+xml"><link rel="stylesheet" href="assets/style.css"></head>
<body class="qr-page"><header class="site-header"><a class="header-brand" href="index.html"><img id="header-logo" src="assets/mascottes/compact-qramen.svg" alt=""><span id="brand-name">Le QRamen</span></a><nav class="restaurant-switch compact" aria-label="Choisir un restaurant"><a data-concept="QRamen" href="https://qramen.alexisld.fr/qr.html">QRamen</a><a data-concept="QRoque" href="https://croq.alexisld.fr/qr.html">QRoque</a></nav><a href="index.html" class="qr-back">Retour à l’accueil</a></header>
<main class="qr-main"><section class="qr-intro"><p class="kicker" id="qr-kicker">LE QRAMEN · ROUEN</p><h1>QR des tables</h1><p>Préparez un QR prêt à imprimer pour chaque table. <a href="salle.html" class="qr-back">Ouvrir la vue salle</a></p></section>
<section class="qr-tools" aria-label="Générateur de QR"><div class="qr-field"><label for="restaurant">Restaurant</label><select id="restaurant"><option value="QRamen">Le QRamen</option><option value="QRoque">QRoque Monsieur</option></select></div><div class="qr-field"><label for="table-name">Nom ou numéro de table</label><input id="table-name" value="T01" maxlength="24" autocomplete="off"></div><div class="qr-actions"><button class="qr-action primary" id="download-png">Télécharger PNG</button><button class="qr-action" id="download-svg">Télécharger SVG</button><button class="qr-action" id="print-custom">Imprimer le chevalet</button></div><div class="qr-preview"><img id="preview-qr" alt="QR code de la table T01"><p id="preview-url"></p></div></section>
<div class="qr-list-heading"><h2>Tables enregistrées</h2><span class="label">CHEVALET A6</span></div><p class="qr-status" id="qr-status" role="status">Tables T01 à T07 · synchronisation…</p><section class="qr-list" id="table-list" aria-label="Liste des QR de table"></section></main><footer class="site-footer qr-signature"><a href="https://github.com/AlexisLD-DEV/qramen">github.com/AlexisLD-DEV/qramen</a></footer>
<section class="qr-print-sheet" id="print-sheet" aria-label="Chevalet imprimable"></section>
<script src="assets/vendor/qrcode.js"></script><script src="assets/api.js"></script><script>
(()=>{const params=new URLSearchParams(location.search);let current=params.get('concept')||(location.hostname.includes('croq')?'QRoque':'QRamen');const $=s=>document.querySelector(s),restaurant=$('#restaurant'),name=$('#table-name'),img=$('#preview-qr'),urlOut=$('#preview-url'),list=$('#table-list'),status=$('#qr-status');const known=Array.from({length:7},(_,i)=>'T'+String(i+1).padStart(2,'0'));let tables=known;
function brand(){const croq=restaurant.value==='QRoque';$('#header-logo').src='assets/mascottes/compact-'+(croq?'qroque':'qramen')+'.svg';$('#site-favicon').href='assets/favicon-'+(croq?'croque':'qramen')+'.svg';$('#brand-name').textContent=croq?'QRoque Monsieur':'Le QRamen';$('#qr-kicker').textContent=croq?'QROQUE MONSIEUR · ROUEN':'LE QRAMEN · ROUEN';document.body.classList.toggle('theme-qroque',croq);document.title='QR des tables — '+(croq?'QRoque Monsieur':'Le QRamen')}
function cleanTable(v){return v.trim().replace(/[?#&]/g,'').slice(0,24)||'T01'}function menuUrl(t){const host=restaurant.value==='QRoque'?'https://croq.alexisld.fr':'https://qramen.alexisld.fr';return host+'/menu.html?table='+encodeURIComponent(cleanTable(t))}
function code(text){const qr=qrcode(0,'M');qr.addData(text);qr.make();return qr.createSvgTag({cellSize:8,margin:24,scalable:true})}function update(){brand();const t=cleanTable(name.value);name.value=t;const u=menuUrl(t);const svg=code(u);img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);img.alt='QR code pour la table '+t;urlOut.textContent=u}
function printTable(t){const croq=restaurant.value==='QRoque',root=$('#print-sheet'),brandName=croq?'QRoque Monsieur':'Le QRamen';root.innerHTML='<div class="print-topline">ROUEN · '+(croq?'CROQUE MONSIEUR':'RAMEN')+'</div><img class="print-mascot" src="assets/mascottes/'+(croq?'croque-2-monsieur':'ramen-1-bol')+'.png" alt="Mascotte '+brandName+'"><h1>Commandez<br>à votre table</h1><p class="print-instruction">Scannez pour commander</p><div class="print-qr-frame"><img class="print-qr" alt="QR code de table"></div><p class="print-table">TABLE <strong>'+cleanTable(t)+'</strong></p><footer>'+brandName+' · ROUEN<br><span>github.com/AlexisLD-DEV/qramen</span></footer>';root.querySelector('.print-qr').src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(code(menuUrl(t)));setTimeout(()=>window.print(),80)}
function render(){list.innerHTML='';tables.forEach(t=>{const u=menuUrl(t),card=document.createElement('article');card.className='qr-table-card';card.innerHTML='<img alt="QR '+t+'"><div><h3></h3><p></p><button class="qr-action">Imprimer ce chevalet</button></div>';card.querySelector('img').src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(code(u));card.querySelector('h3').textContent=t;card.querySelector('p').textContent=u;card.querySelector('button').onclick=()=>printTable(t);list.append(card)})}
function svgCurrent(){return code(menuUrl(name.value))}function download(blob,n){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=n;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
name.addEventListener('input',update);restaurant.addEventListener('change',()=>{update();render()});$('#download-svg').onclick=()=>download(new Blob([svgCurrent()],{type:'image/svg+xml'}),'qr-'+cleanTable(name.value)+'.svg');$('#download-png').onclick=()=>{const svg=svgCurrent(),objectUrl=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'})),image=new Image();image.onload=()=>{const canvas=document.createElement('canvas');canvas.width=1200;canvas.height=1200;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,1200,1200);ctx.drawImage(image,0,0,1200,1200);canvas.toBlob(blob=>download(blob,'qr-'+cleanTable(name.value)+'.png'),'image/png');URL.revokeObjectURL(objectUrl)};image.src=objectUrl};$('#print-custom').onclick=()=>printTable(name.value);
(async()=>{const croq=current==='QRoque';restaurant.value=croq?'QRoque':'QRamen';document.querySelectorAll('.restaurant-switch a').forEach(a=>{if((a.dataset.concept==='QRoque')===croq)a.setAttribute('aria-current','page')});update();render();try{const r=await qramenFetch('/menu?concept='+encodeURIComponent(restaurant.value),{timeoutMs:4500});if(!r.ok)throw 0;const d=await r.json();const rows=d.tables||d.tablesDuRestaurant||d.restaurant?.tables||[];const names=rows.map(x=>typeof x==='string'?x:(x.numero||x.nom||x.code||x.table)).filter(Boolean);if(names.length)tables=names.map(cleanTable);status.textContent=names.length?tables.length+' tables reçues du menu':'Tables T01 à T07 · valeurs par défaut';}catch{status.textContent='Tables T01 à T07 · mode hors connexion';}render()})();
window.addEventListener('beforeprint',()=>{if(!$('#print-sheet').innerHTML)printTable(name.value)});
})();</script></body></html>
