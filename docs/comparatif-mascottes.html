<!doctype html>

<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comparatif des mascottes compactes — QRamen &amp; QRoque</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:32px;font:16px/1.45 system-ui,sans-serif;background:#f5f1e9;color:#30251f}h1{margin:0 0 8px;font-size:clamp(24px,4vw,38px)}p{margin:0 0 28px;color:#6f665d}.brand{margin:26px 0 36px}.brand h2{margin:0 0 12px;font-size:23px}.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.sample{min-height:190px;padding:18px;border:1px solid #ddd2c3;border-radius:16px;background:#fffaf1}.sample.dark{background:#171a1e;color:#f3f0e7;border-color:#43474b}.kind{display:block;margin-bottom:14px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em}.pair{display:flex;align-items:center;justify-content:center;gap:28px;min-height:120px}.full{width:116px;height:116px;object-fit:contain}.scale{display:flex;align-items:flex-end;gap:10px}.scale figure{display:grid;justify-items:center;gap:6px;margin:0;font-size:11px}.scale img{width:32px;height:32px;object-fit:contain}.scale figure:first-child img{width:20px;height:20px}.scale figure:last-child img{width:16px;height:16px}@media(max-width:580px){body{padding:18px}.row{grid-template-columns:1fr}.sample{min-height:160px}}

<h1>Comparatif des mascottes</h1><p>Illustration complète et variante vectorielle compacte, sur fonds clair et sombre. Les logos sont également lisibles à 20 px dans l’en-tête.</p>
<section class="brand"><h2>QRamen — bol de ramen</h2><div class="row">
<div class="sample"><span class="kind">Thème clair</span><div class="pair"><img class="full" src="../public/assets/mascottes/ramen-1-bol.webp" alt="Mascotte complète QRamen"><div class="scale"><figure><img src="../public/assets/mascottes/compact-qramen.svg" alt=""><figcaption>20 px</figcaption></figure><figure><img src="../public/assets/mascottes/compact-qramen.svg" alt=""><figcaption>32 px</figcaption></figure></div></div></div>
<div class="sample dark"><span class="kind">Thème sombre</span><div class="pair"><img class="full" src="../public/assets/mascottes/ramen-1-bol.webp" alt="Mascotte complète QRamen"><div class="scale"><figure><img src="../public/assets/mascottes/compact-qramen.svg" alt=""><figcaption>20 px</figcaption></figure><figure><img src="../public/assets/mascottes/compact-qramen.svg" alt=""><figcaption>32 px</figcaption></figure></div></div></div></div></section>
<section class="brand"><h2>QRoque — monsieur moustachu</h2><div class="row">
<div class="sample"><span class="kind">Thème clair</span><div class="pair"><img class="full" src="../public/assets/mascottes/croque-2-monsieur.webp" alt="Mascotte complète QRoque"><div class="scale"><figure><img src="../public/assets/mascottes/compact-qroque.svg" alt=""><figcaption>20 px</figcaption></figure><figure><img src="../public/assets/mascottes/compact-qroque.svg" alt=""><figcaption>32 px</figcaption></figure></div></div></div>
<div class="sample dark"><span class="kind">Thème sombre</span><div class="pair"><img class="full" src="../public/assets/mascottes/croque-2-monsieur.webp" alt="Mascotte complète QRoque"><div class="scale"><figure><img src="../public/assets/mascottes/compact-qroque.svg" alt=""><figcaption>20 px</figcaption></figure><figure><img src="../public/assets/mascottes/compact-qroque.svg" alt=""><figcaption>32 px</figcaption></figure></div></div></div></div></section>
</body></html>
