<!doctype html><html lang="fr"><meta charset="utf-8"><title>Comparatif mascotte et petit logo</title><style>
*{box-sizing:border-box}body{margin:0;padding:30px;background:#eee9df;color:#35251e;font:15px/1.4 Arial,sans-serif}.concept{margin:0 auto 26px;padding:24px;width:1000px;background:#fffdf8;border-radius:14px}.concept h1{font-size:21px;margin:0 0 14px}.grid{display:grid;grid-template-columns:170px repeat(3,1fr);gap:8px}.head,.label{font-weight:700;padding:7px}.cell{height:92px;display:flex;align-items:center;justify-content:center;border-radius:8px}.light{background:#fff9eb}.dark{background:#292522}.both{display:grid;grid-template-columns:1fr 1fr;gap:6px}.source{width:150px;height:150px;object-fit:contain}.small{object-fit:contain;image-rendering:auto}.sizes{display:flex;align-items:center;gap:12px}.sizebox{width:75px;text-align:center;font-size:11px}.sizebox .cell{height:64px;margin-bottom:4px}.s16{width:16px;height:16px}.s24{width:24px;height:24px}.s32{width:32px;height:32px}
</style><body>
<script>
const items=[['QRamen','ramen-1-bol','identite-qramen'],['QRoque Monsieur','croque-2-monsieur','identite-qroque']];
for(const [title,source,icon] of items){document.write(`<section class="concept"><h1>${title} — source de la mascotte et petit logo transparent</h1><div class="grid"><div class="head">Comparaison</div><div class="head">16 px</div><div class="head">24 px</div><div class="head">32 px</div><div class="label">Mascotte source</div><div class="cell light" style="grid-column:span 3"><img class="source" src="../../public/assets/mascottes/${source}.png"></div><div class="label">Petit logo · fond clair / sombre</div>${[16,24,32].map(n=>`<div class="sizes"><div class="sizebox"><div class="cell light"><img class="small s${n}" src="../../public/assets/mascottes/${icon}.png"></div>clair</div><div class="sizebox"><div class="cell dark"><img class="small s${n}" src="../../public/assets/mascottes/${icon}.png"></div>sombre</div></div>`).join('')}<div class="label">Favicon · même fichier</div>${[16,24,32].map(n=>`<div class="sizes"><div class="sizebox"><div class="cell light"><img class="small s${n}" src="../../public/assets/mascottes/${icon}.png"></div>clair</div><div class="sizebox"><div class="cell dark"><img class="small s${n}" src="../../public/assets/mascottes/${icon}.png"></div>sombre</div></div>`).join('')}</div></section>`)}
</script></body></html>
